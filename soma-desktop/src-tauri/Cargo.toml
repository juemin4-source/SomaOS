[package]
name = "soma-desktop"
version = "0.1.0"
edition = "2021"
description = "SomaOS Desktop — Tauri frontend"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
soma-client = { path = "../../soma-client" }
soma-protocol = { path = "../../soma-protocol" }
