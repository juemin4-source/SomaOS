[package]
name = "soma-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "soma-runtime"
path = "src/main.rs"

[dependencies]
soma-core = { path = "../soma-core" }
soma-store = { path = "../soma-store" }
soma-capability = { path = "../soma-capability" }
soma-model = { path = "../soma-model" }
soma-model-rig = { path = "../soma-model-rig" }
soma-protocol = { path = "../soma-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
