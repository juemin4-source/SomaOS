[package]
name = "soma-capability"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread"] }
walkdir = "2"
soma-model = { path = "../soma-model" }

[dev-dependencies]
tempfile = "3"
