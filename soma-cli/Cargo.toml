[package]
name = "soma-cli"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
soma-client = { path = "../soma-client" }
soma-protocol = { path = "../soma-protocol" }
soma-tui = { path = "../soma-tui" }
